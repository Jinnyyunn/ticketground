name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test backend and iOS tooling regressions
        run: node --test --test-concurrency=1 tests/backend-api-flow.test.mjs tests/backend-persistence.test.mjs tests/booking-single-checkout-flow.test.mjs tests/discovery-api.test.mjs tests/event-id-mapping.test.mjs tests/inquiry-show-context.test.mjs tests/ios-discovery-contract.test.mjs tests/ios-tooling-regression.test.mjs tests/native-support-api.test.mjs tests/native-watchlist-api.test.mjs

      - name: Test GitHub bot
        run: node --test tests/ticketground-github-bot.test.mjs

  ios-native:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select available iPhone simulator
        id: simulator
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"]
          for runtime in reversed(list(devices.values())):
              for device in runtime:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          ')
          echo "device-id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Build and run focused native tests
        run: |
          xcodebuild test \
            -project ios/TicketGroundApp/TicketGroundApp.xcodeproj \
            -scheme TicketGroundApp \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device-id }}" \
            -only-testing:TicketGroundAppTests/LiveBackendServiceTests \
            -only-testing:TicketGroundAppTests/AppEnvironmentTests \
            -only-testing:TicketGroundAppTests/LoadingMediaTests \
            -only-testing:TicketGroundAppTests/TicketGroundAppTests \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testHomeRankingAndOpenCalendar \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testLiveStateOnlyHomeCanRetryCatalogAdmission \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testLiveCatalogRoutesUseOneUnavailableSurface \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testAdmittedLiveCatalogEnablesSearchRankingGenreAndGoods \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testAdmittedLiveCatalogShowsReadOnlySeatMap \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testAdmittedLiveCatalogExposesVersionedDiscoveryRoutes \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testLiveDiscoverySeparatesEmptyNotFoundAndServerErrorStates \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testLiveMenuOpensCapabilityLedger \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testLiveHamburgerMenuProvidesWebLikeLinksAndLiveAccountEntry \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testAuthenticatedSupportProtectsDraftsAndExpiredSessions \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testCreateLogoutDismissesSupportDetail \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testAuthenticatedWatchlistSynchronizesDetailPreferencesAndRollback \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testWatchlistPreferenceReconcilesCommittedServerStateAfterResponseLoss \
            -only-testing:TicketGroundAppUITests/DiscoveryTests/testWatchlistDetailRetryReloadsServerState
